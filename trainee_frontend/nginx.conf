server {
    # 1. Listen on standad HTTP port 80 inside the container
    listen 80;
    server_name localhost;

    # 2. Tell Nginx where the built React files live
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. SPA Route fix: if a user visits /admin or /courses, don't show 404.
    # just let React Router in index.html decide.
    location / {
        try_files $uri $uri /index.html;
    }

    # 4. Performance: Cache images, JS, and CSS files so pages load instantly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 5. Error pages: when things break, show our nice React error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}