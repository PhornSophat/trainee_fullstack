version: '3.8'

services:
  backend:
    container_name: trainee_backend
    build:
      context: ./trainee_backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./trainee_backend/.env
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    container_name: trainee_frontend
    build:
      context: ./trainee_frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
